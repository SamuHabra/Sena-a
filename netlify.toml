# ═══════════════════════════════════════════
#  GIC SE-NA'A — Configuration Netlify
# ═══════════════════════════════════════════

[build]
  publish = "."
  command = ""

# ── PAGE 404 PERSONNALISÉE ──────────────────
[[redirects]]
  from = "/*"
  to   = "/404.html"
  status = 404

# ── ADMIN CMS ───────────────────────────────
[[redirects]]
  from = "/admin"
  to   = "/admin/index.html"
  status = 200

# ── HEADERS SÉCURITÉ ────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ── CACHE IMAGES ────────────────────────────
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
